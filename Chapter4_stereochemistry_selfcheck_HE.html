<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>בדיקה עצמית — סטריאוכימיה | פרק 4</title>
<style>
:root{font-family:Arial,'Noto Sans Hebrew',sans-serif;color:#182b3c;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}main{max-width:800px;margin:28px auto;padding:0 18px 48px}header{background:#153b56;color:#fff;padding:27px;border-radius:16px}header h1{font-size:27px;margin:0 0 7px}header p{margin:0;color:#dce9f2;line-height:1.55}.panel{background:white;border:1px solid #dbe4eb;border-radius:16px;padding:25px;margin-top:17px;box-shadow:0 2px 14px #18384a09}.meta{display:flex;justify-content:space-between;gap:12px;color:#526879;font-size:14px}.progress{height:8px;border-radius:20px;background:#e8eef3;margin:18px 0;overflow:hidden}.progress>div{height:100%;background:#1680a8;transition:width .2s}h2{font-size:22px;line-height:1.6;margin:18px 0;overflow-wrap:anywhere}button{font:inherit;cursor:pointer;border-radius:9px;padding:11px 15px}.option{display:block;width:100%;text-align:right;border:1px solid #cfdce6;background:#fff;margin:9px 0;line-height:1.7}.option:hover:not(:disabled){background:#f1f8fc;border-color:#85b7d3}.option.selected{border:2px solid #087eab;background:#e9f5fb}.option:disabled{cursor:default}.option.key{border-color:#2e8b62;background:#eef9f1}.feedback{padding:14px 17px;border-radius:10px;background:#f1f5f8;line-height:1.75;margin-top:16px;border-right:4px solid #7c9db0}.feedback.good{background:#edf8ef;border-color:#338758}.feedback.bad{background:#fff4e9;border-color:#ca853b}.controls{display:flex;gap:9px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-top:18px}.primary{border:0;background:#087da4;color:white;font-weight:bold}.primary:disabled{opacity:.4;cursor:default}.secondary{border:1px solid #bfd1df;background:white;color:#264f6b}.small{font-size:13px;color:#5b7384}.hint{background:#eff6fb;border:1px solid #d4e5f0;border-radius:8px;padding:12px;line-height:1.65;margin-top:12px}.hide{display:none}.results{text-align:center}.results strong{font-size:42px;color:#12658b}.review{display:grid;gap:8px;margin-top:20px}.review div{padding:10px;border:1px solid #dde6ed;border-radius:9px;text-align:right}.chem{unicode-bidi:isolate;direction:ltr;display:inline-block}button:focus-visible{outline:3px solid #e9a93c;outline-offset:2px}@media(max-width:500px){header{padding:20px}header h1{font-size:22px}.panel{padding:17px}h2{font-size:19px}.controls{align-items:stretch}.controls button{flex:1}}
</style></head><body><main><header><h1>בדיקה עצמית — סטריאוכימיה</h1><p>כימיה אורגנית 20456 · פרק 4 · 15 שאלות מהבסיס ועד יישום מתקדם. בחרו תשובה אחת לכל שאלה וקבלו משוב המסביר את העיקרון.</p></header><section class="panel" id="quiz"><div class="meta"><span id="topic"></span><span id="count"></span></div><div class="progress"><div id="bar"></div></div><h2 id="stem"></h2><div id="options"></div><div id="hint" class="hint hide"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><div class="controls"><button id="hintBtn" class="secondary">רמז</button><button id="check" class="primary" disabled>בדיקת תשובה</button><button id="next" class="secondary" disabled>לשאלה הבאה</button></div></section><section id="results" class="panel results hide" aria-live="polite"></section></main><script>
'use strict';
const QUESTIONS=[{"topic": "סוגי איזומרים", "level": 1, "question": "מהו היחס בין בוטאן (CH₃CH₂CH₂CH₃) לבין 2-מתילפרופאן ((CH₃)₃CH)?", "options": ["אננטיומרים", "דיאסטראומרים", "איזומרים מבניים (קונסטיטוציוניים)", "שתי קונפורמציות של אותה מולקולה"], "correct": 2, "explain": "לשתי התרכובות אותה נוסחה מולקולרית, C₄H₁₀, אך קשריות שונה בין אטומי הפחמן. לכן הן איזומרים מבניים.", "hint": "הבחינו בין שינוי בקישוריות האטומים לבין שינוי במיקומם במרחב."}, {"topic": "מרכזים סטריאוגניים", "level": 1, "question": "כמה מרכזי פחמן סטריאוגניים יש ב־3-מתילהקסאן: CH₃CH₂CH(CH₃)CH₂CH₂CH₃?", "options": ["0", "1", "2", "3"], "correct": 1, "explain": "לפחמן 3 קשורות ארבע קבוצות שונות: H, CH₃, CH₂CH₃ ו־CH₂CH₂CH₃. לכן הוא מרכז סטריאוגני יחיד.", "hint": "בדקו את כל ארבע הקבוצות היוצאות מפחמן 3, לא רק את מספר קשרי הפחמן שלו."}, {"topic": "כירליות", "level": 1, "question": "איזו מהתרכובות הבאות מכילה פחמן טטרהדרלי הקשור לארבע קבוצות שונות?", "options": ["2-מתילפרופאן", "2-כלורופרופאן", "2-פלואורובוטאן", "2,2-דימתילפרופאן"], "correct": 2, "explain": "ב־2-פלואורובוטאן, הפחמן הנושא F קשור גם ל־H, CH₃ ו־CH₂CH₃ — ארבע קבוצות שונות. בשאר הדוגמאות יש קבוצות זהות סביב כל פחמן אפשרי.", "hint": "חפשו פחמן sp³ ובדקו האם שתיים מן הקבוצות שלו זהות."}, {"topic": "E/Z", "level": 1, "question": "באיזו תרכובת מבין הבאות לא ניתן להגדיר איזומריית E/Z עבור הקשר הכפול?", "options": ["CH₃CH=CHCH₂CH₃", "CH₃CH=C(Br)Cl", "CH₂=C(CH₃)CH₂CH₃", "BrCH=CHCl"], "correct": 2, "explain": "ב־CH₂=C(CH₃)CH₂CH₃ לפחמן הקצה של הקשר הכפול קשורים שני אטומי H זהים, ולכן אין אפשרות ל־E/Z.", "hint": "לכל אחד משני פחמני הקשר הכפול דרושות שתי קבוצות שונות."}, {"topic": "קדימויות E/Z", "level": 2, "question": "באלקן HOCH₂–CH=CH–CH₂Cl, אילו קבוצות מקבלות קדימות גבוהה יותר לפי CIP על שני פחמני הקשר הכפול?", "options": ["CH₂OH ו־CH₂Cl", "H ו־H", "CH₂OH ו־H", "H ו־CH₂Cl"], "correct": 0, "explain": "בכל פחמן של הקשר הכפול משווים בין C של קבוצת CH₂X לבין H. פחמן (6) מקבל קדימות גבוהה ממימן (1), משני הצדדים.", "hint": "ההשוואה הראשונה היא בין האטומים הקשורים ישירות לפחמני C=C."}, {"topic": "כללי CIP", "level": 2, "question": "סדר הקדימויות הנכון של המתמירים CH₂Cl, CH₂F, CH₂OH ו־CH₃ סביב אותו מרכז הוא:", "options": ["CH₂OH > CH₂F > CH₂Cl > CH₃", "CH₂Cl > CH₂F > CH₂OH > CH₃", "CH₂F > CH₂Cl > CH₂OH > CH₃", "CH₂Cl > CH₂OH > CH₂F > CH₃"], "correct": 1, "explain": "כל המתמירים מתחילים בפחמן. בשכבה הבאה משווים (Cl,H,H), (F,H,H), (O,H,H), (H,H,H). לכן Cl > F > O > H בנקודת ההבדל הראשונה.", "hint": "לכל מתמיר רשמו את שלושת האטומים הקשורים לפחמן הראשון, לפי סדר מספר אטומי יורד."}, {"topic": "R/S", "level": 2, "question": "בקביעת R/S, קבוצה 4 פונה הרחק מהצופה, והמעבר 1→2→3 הוא עם כיוון השעון. מהי הקונפיגורציה?", "options": ["R", "S", "E", "לא ניתן לקבוע"], "correct": 0, "explain": "כאשר הקבוצה בעלת הקדימות הנמוכה ביותר (4) מצביעה לאחור, מסלול עם כיוון השעון מגדיר R.", "hint": "בדקו תחילה לאן פונה קבוצה 4, ורק אחר כך את מסלול 1→2→3."}, {"topic": "R/S", "level": 2, "question": "בקביעת R/S, קבוצה 4 פונה ישירות אל הצופה, והמעבר 1→2→3 נראה עם כיוון השעון. מהי הקונפיגורציה?", "options": ["R", "S", "Z", "אי אפשר לקבוע ללא נוסחה מולקולרית"], "correct": 1, "explain": "כאשר קבוצה 4 מצביעה אל הצופה, יש להפוך את הכיוון המתקבל במבט: מסלול שנראה עם כיוון השעון מתאים ל־S.", "hint": "השוו למקרה שבו קבוצה 4 פונה לאחור. האם יש לשמור או להפוך את התוצאה?"}, {"topic": "היטל פישר", "level": 2, "question": "בהיטל פישר תקני של פחמן טטרהדרלי, מה נכון לגבי הקשרים האופקיים?", "options": ["הם פונים הרחק מהצופה", "הם פונים אל הצופה", "כולם נמצאים במישור הדף", "כיוון הקשרים נקבע לפי סדר הקדימויות"], "correct": 1, "explain": "בהיטל פישר הקשרים האופקיים פונים אל הצופה, והאנכיים פונים ממנו והלאה.", "hint": "זכרו שהיטל פישר הוא מוסכמה מרחבית, לא רק ציור בצורת צלב."}, {"topic": "סיבוב לעומת היפוך", "level": 2, "question": "מה קורה לקונפיגורציית R/S של מרכז סטריאוגני כאשר מסובבים את המולקולה בשלמותה במרחב בלי לשבור קשרים?", "options": ["R הופך ל־S בכל סיבוב של 180°", "הקונפיגורציה נשמרת", "מתקבלת תמיד מולקולת מזו", "הקונפיגורציה משתנה רק בממס פולרי"], "correct": 1, "explain": "סיבוב קשיח של מולקולה משנה את נקודת המבט בלבד. הוא אינו משנה את סדר הקבוצות סביב המרכז ולכן אינו מחליף R ו־S.", "hint": "הבחינו בין סיבוב הגוף כולו לבין החלפת שתי קבוצות מחוברות."}, {"topic": "אננטיומרים", "level": 3, "question": "מהו היחס בין (2R,3S)-2,3-דיברומופנטאן לבין (2S,3R)-2,3-דיברומופנטאן?", "options": ["אותה מולקולה", "איזומרים מבניים", "אננטיומרים", "דיאסטראומרים"], "correct": 2, "explain": "שני המרכזים עברו R↔S, והקשריות זהה. ל־2,3-דיברומופנטאן אין סימטריה פנימית ההופכת זוג זה לתרכובת מזו; לכן אלה אננטיומרים.", "hint": "בדקו אם כל המרכזים הוחלפו ואם לשלד יש סימטריה שעלולה להפוך זוג מבנים לזהה."}, {"topic": "דיאסטראומרים", "level": 3, "question": "מהו היחס בין (2R,3S)-2,3-דיברומופנטאן לבין (2R,3R)-2,3-דיברומופנטאן?", "options": ["אננטיומרים", "דיאסטראומרים", "אותה תרכובת בקונפורמציות שונות", "איזומרים מבניים"], "correct": 1, "explain": "הקשריות זהה אבל הקונפיגורציה שונה רק במרכז 3. סטריאואיזומרים שאינם תמונות ראי לא־חופפות זה של זה הם דיאסטראומרים.", "hint": "השוו את התצורה בכל מרכז בנפרד ולא רק את מספר המרכזים."}, {"topic": "מספר סטריאואיזומרים", "level": 3, "question": "במולקולה בעלת שלושה מרכזים סטריאוגניים בלתי תלויים, ללא צורות מזו וללא יסודות סטריאוגניים נוספים, מהו מספר הסטריאואיזומרים האפשרי?", "options": ["4", "6", "8", "16"], "correct": 2, "explain": "כאשר לכל אחד משלושה מרכזים יש שתי אפשרויות בלתי תלויות וללא הפחתה בשל סימטריה, המספר הוא 2³ = 8.", "hint": "כל מרכז חדש מכפיל את מספר אפשרויות הקונפיגורציה כאשר אין סימטריה שמזהה ביניהן."}, {"topic": "תרכובות מזו", "level": 3, "question": "איזה משפט מתאר נכונה את (2R,3S)-2,3-דיברומובוטאן?", "options": ["הוא תרכובת מזו ואכירלי", "הוא אננטיומר של (2S,3R)-2,3-דיברומובוטאן", "הוא תערובת רצמית של שני חומרים", "הוא חייב לסובב אור מקוטב כי יש בו שני מרכזים סטריאוגניים"], "correct": 0, "explain": "ב־2,3-דיברומובוטאן הסימטרי, תצורות (2R,3S) ו־(2S,3R) מתארות אותה תרכובת מזו אכירלית. היא אינה תערובת רצמית.", "hint": "הבדילו בין נוכחות מרכזים סטריאוגניים לבין כירליות של המולקולה השלמה."}, {"topic": "פעילות אופטית", "level": 3, "question": "דגימה של חומר כירלי מכילה 75% מהאננטיומר R ו־25% מהאננטיומר S. מהו העודף האננטיומרי (ee)?", "options": ["25% לטובת R", "50% לטובת R", "75% לטובת R", "100% לטובת R"], "correct": 1, "explain": "העודף האננטיומרי הוא ההפרש בין השברים: 75% − 25% = 50% לטובת R. סימן הסיבוב האופטי אינו נקבע מהאות R.", "hint": "חשבו את ההפרש בין שני האחוזים, לא את חלקו של האננטיומר העיקרי לבדו."}];
let ix=0,selection=null,locked=false,score=0,history=[];
const el=id=>document.getElementById(id);
function showQuestion(){const q=QUESTIONS[ix];selection=null;locked=false;el('topic').textContent=`רמה ${q.level} · ${q.topic}`;el('count').textContent=`שאלה ${ix+1} מתוך ${QUESTIONS.length}`;el('bar').style.width=`${100*ix/QUESTIONS.length}%`;el('stem').textContent=q.question;el('options').replaceChildren();q.options.forEach((choice,i)=>{let b=document.createElement('button');b.className='option';b.type='button';b.textContent=`${'אבגד'[i]}. ${choice}`;b.onclick=()=>{if(locked)return;selection=i;[...el('options').children].forEach((node,j)=>node.classList.toggle('selected',i===j));el('check').disabled=false};el('options').appendChild(b)});el('hint').classList.add('hide');el('hint').textContent=q.hint;el('feedback').className='feedback hide';el('feedback').textContent='';el('hintBtn').disabled=false;el('check').disabled=true;el('next').disabled=true;el('next').textContent=ix===QUESTIONS.length-1?'סיום והצגת תוצאות':'לשאלה הבאה'}
el('hintBtn').onclick=()=>{el('hint').classList.remove('hide');el('hintBtn').disabled=true};
el('check').onclick=()=>{if(locked||selection===null)return;locked=true;let q=QUESTIONS[ix],good=selection===q.correct;if(good)score++;history.push({good,topic:q.topic,question:q.question});[...el('options').children].forEach((b,i)=>{b.disabled=true;b.classList.toggle('key',i===q.correct)});let f=el('feedback');f.className='feedback '+(good?'good':'bad');f.textContent=(good?'נכון. ':'לא נכון. ')+q.explain;el('check').disabled=true;el('next').disabled=false};
el('next').onclick=()=>{if(!locked)return;if(ix<QUESTIONS.length-1){ix++;showQuestion()}else showResults()};
function showResults(){el('quiz').classList.add('hide');el('results').classList.remove('hide');let res=el('results');res.replaceChildren();const h=document.createElement('h2');h.textContent='סיימתם את הבדיקה העצמית';res.appendChild(h);const n=document.createElement('strong');n.textContent=`${score} / ${QUESTIONS.length}`;res.appendChild(n);const p=document.createElement('p');p.textContent=score>=13?'שליטה טובה מאוד. אפשר לעבור לתרגול מרחבי עצמאי.':score>=10?'בסיס טוב. כדאי לחזור על הנושאים שבהם טעיתם.':'מומלץ לחזור על כללי הקדימות ועל יחסים בין סטריאואיזומרים לפני תרגול נוסף.';res.appendChild(p);const list=document.createElement('div');list.className='review';history.forEach((r,i)=>{let d=document.createElement('div');d.textContent=`${r.good?'✓':'✗'} שאלה ${i+1} · ${r.topic}`;list.appendChild(d)});res.appendChild(list);const btn=document.createElement('button');btn.className='primary';btn.textContent='תרגול מחדש';btn.style.marginTop='20px';btn.onclick=()=>{ix=0;score=0;history=[];el('results').classList.add('hide');el('quiz').classList.remove('hide');showQuestion()};res.appendChild(btn)}
showQuestion();
</script></body></html>
